<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="styles.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Main Menu</title>
		<script type="module" src="js/checkforfile.js" defer></script>
		<script type="module" src="js/table.js" defer></script>
		<script type="module" src="js/popup.js" defer></script>
		<script type="module" src="js/print.js" defer></script>
		<script type="module" src="js/presets.js" defer></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	</head>
	<nav>
		<a href="/"><img src="assets/invoicer.png" alt="Incoiver logo" /></a>
		<a id="settings" href="settings.html"><img src="assets/settings.png" alt="Settings" /></a>
	</nav>
	<body>
		<main>
			<h1 id="tableH1"></h1>
			<div id="tableContainer">
				<div id="tableControls">
					<button id="addBtn">+</button>
					<div class="tableNavContainer">
						<button id="filterBtn" class="tableNavBtn">
							<span id="filter"></span>
						</button>
						<div id="popupfilter" class="tableNavPopup">
							<div class="tableNavContainer">
								<button class="presetBtn tableNavBtn" name="filterpresets">
									<i class="material-icons">save</i>
								</button>
								<div class="tableNavPopup">
									<h2>Presets</h2>
									<button class="close preset">X</button>
									<p id="message"></p>
									<p>Saved Presets</p>
									<div class="presetContainer"></div>
									<p>Name</p>
									<input></input>
									<div>
										<button class="presetLoad" name="filterpresets">Load</button>
										<button class="presetSave" name="filterpresets">Save</button>
									</div>
								</div>
							</div>
							<div class="tableDataContainer">
								<h2>Filter</h2>
								<button class="close">X</button>
							</div>
						</div>
					</div>
					<div class="tableNavContainer">
						<button id="printBtn" class="tableNavBtn">
							<span class="fa fa-print"></span>
						</button>
						<div id="popupPrint" class="tableNavPopup">
							<div class="tableNavContainer">
								<button class="presetBtn tableNavBtn" name="printpresets">
									<i class="material-icons">save</i>
								</button>
								<div class="tableNavPopup">
									<h2>Presets</h2>
									<button class="close preset">X</button>
									<p id="message"></p>
									<p>Saved Presets</p>
									<div class="presetContainer"></div>
									<p>Name</p>
									<input></input>
									<div>
										<button class="presetLoad" name="printpresets">Load</button>
										<button class="presetSave" name="printpresets">Save</button>
									</div>
								</div>
							</div>
							<div class="tableDataContainer">
								<h2>Print Options</h2>
								<button class="close">X</button>
								<p id="message"></p>
								<p>Title</p>
								<input type="text" id="title" name="title"></input>
								<p>Columns</p>
								<div id="columns"></div>
								<p>Extras</p>
								<div>
									<input type="checkbox" id="rowTotal" name="Row Total"></input>
									<label for="rowTotal">Row Total</label>
								</div>
								<div>
									<input type="checkbox" id="tallyTotal" name="Tally Total"></input>
									<label for="tallyTotal">Tally Total</label>
								</div>
								<ol></ol>
								<button id="printSubmit">Print</button>
							</div>
						</div>
					</div>
				</div>
				<table id="table">
					
				</table>
			</div>
			<div id="popupmenu">
				<form id="popupdata"></form>
			</div>
		</main>
	</body>
	<iframe src="print.html"></iframe>
</html>
