<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="styles.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Settings</title>
		<script type="module" src="js/settings.js" defer></script>
	</head>
	<nav>
		<a href="/"><img src="assets/invoicer.png" alt="Incoiver logo" /></a>
	</nav>

	<body>
		<main>
			<h1>Settings</h1>

			<div id="container">
				<div id="formDiv">
					<h2>Database</h2>
					<p id="message"></p>
					<select name="type" id="type">
						<option value="mysql" selected>MySQL</option>
						<option value="postgresql">PostgreSQL</option>
						<option value="sqlite">SQLite</option>
					</select>
					<form>
					</form>
				</div>

				<div id="displayDiv">
					<h2>Display</h2>
					<p>Company</p>
					<input id="company"></input>
					<p>Currency</p>
					<select name="currency" id="currency">
						<option value="£" selected>£</option>
						<option value="$">$</option>
						<option value="€">€</option>
						<option value="¥">¥</option>
						<option value="₹">₹</option>
						<option value="₽">₽</option>
						<option value="₩">₩</option>
					</select>
				</div>
			</div>
		</main>
	</body>
</html>
